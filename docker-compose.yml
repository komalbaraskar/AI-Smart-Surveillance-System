services:

  surveillance:
    build: .
    container_name: ai-surveillance
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/surveillance
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: surveillance-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: