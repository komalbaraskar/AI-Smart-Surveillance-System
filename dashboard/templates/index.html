<html>
<head>

            background: #222;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            display: inline-block;
        }

</head>
<body>

<div class="card">
    <h2>Alerts</h2>
    <p>{{ data.alerts }}</p>
</div>

</body>
</html>
