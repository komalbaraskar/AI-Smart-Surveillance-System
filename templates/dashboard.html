<!DOCTYPE html>
<html>
<head>
    <title>AI Surveillance Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        .card {
            background: #222;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            display: inline-block;
            width: 200px;
        }

        table {
            margin: auto;
            margin-top: 20px;
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid white;
            padding: 10px;
        }

        th {
            background: #444;
        }
    </style>
</head>
<body>

    <h1>🚀 AI Surveillance Dashboard</h1>

    <div class="card">
        <h2>Total Alerts</h2>
        <p>{{ total_alerts }}</p>
    </div>

    <div class="card">
        <h2>People Count</h2>
        <p>{{ people_count }}</p>
    </div>

    <h2>Recent Logs</h2>

    <table>
        <tr>
            <th>Message</th>
            <th>Time</th>
        </tr>

        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
