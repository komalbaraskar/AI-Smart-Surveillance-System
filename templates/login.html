<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Secure Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            padding: 35px;

            background: #1f2937;
            border-radius: 12px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: none;
            border-radius: 6px;

            background: #374151;
            color: white;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 20px;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🛡️ Smart Surveillance</h1>

    <div class="subtitle">
        Security Management System
    </div>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>
</body>
</html>
